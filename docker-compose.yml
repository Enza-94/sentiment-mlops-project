services:
  api:
    build: .
    ports:
      - "8000:8000"
  

  drift-monitor:
    build: .
    command: python drift_monitor.py
    volumes:
      - ./reports:/app/reports
  

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    extra_hosts:
    - "host.docker.internal:host-gateway"
    